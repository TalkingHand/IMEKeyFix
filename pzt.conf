# pzt settings for IMEKeyFix (bash syntax, sourced by pzt).
BUILD="bash tools/build.sh"
TEST_FILES=("tests/IMEKeyFix_Test.lua IMEKeyFix/42/media/lua/client/")
LOG_GREP='\[IMEKeyFix'
TIMEOUT=600
# IMEKeyFix.applied(): 1 IME attached, 0 detached. checked(): ImmGetContext saw a context.
STEPS=(
  "wait 30"
  "check IMEKeyFix ~= nil"
  "check IMEKeyFix.error() == nil"
  "lua IMEKeyFixTest.state('in game')"
  "check IMEKeyFix.applied() == 0"
  "check not IMEKeyFix.checked()"

  "lua IMEKeyFixTest.openBox()"
  "wait 5"
  "lua IMEKeyFixTest.state('text box focused')"
  "check IMEKeyFix.typing()"
  "check IMEKeyFix.applied() == 1"
  "check IMEKeyFix.checked()"
  "lua IMEKeyFixTest.box:unfocus()"
  "wait 5"
  "lua IMEKeyFixTest.state('text box unfocused')"
  "check IMEKeyFix.applied() == 0"
  "check not IMEKeyFix.checked()"
  "lua IMEKeyFixTest.box:focus()"
  "wait 5"
  "check IMEKeyFix.applied() == 1"
  "lua IMEKeyFixTest.box:setVisible(false)"
  "wait 5"
  "lua IMEKeyFixTest.state('focused box hidden')"
  "check IMEKeyFix.applied() == 0"
  "lua IMEKeyFixTest.closeBox()"

  "lua IMEKeyFixTest.openCraft()"
  "wait 30"
  "check IMEKeyFixTest.hasSearch('HandcraftWindow')"
  "check IMEKeyFix.applied() == 0"
  "lua IMEKeyFixTest.focusSearch('HandcraftWindow')"
  "wait 5"
  "lua IMEKeyFixTest.state('craft search focused')"
  "check IMEKeyFix.applied() == 1"
  "shot craft"
  "lua IMEKeyFixTest.closeWindow('HandcraftWindow')"
  "wait 5"
  "lua IMEKeyFixTest.state('craft window closed')"
  "check IMEKeyFix.applied() == 0"

  "lua IMEKeyFixTest.openBuild()"
  "wait 30"
  "check IMEKeyFixTest.hasSearch('BuildWindow')"
  "lua IMEKeyFixTest.focusSearch('BuildWindow')"
  "wait 5"
  "lua IMEKeyFixTest.state('build search focused')"
  "check IMEKeyFix.applied() == 1"
  "lua IMEKeyFixTest.closeWindow('BuildWindow')"
  "wait 5"
  "lua IMEKeyFixTest.state('build window closed')"
  "check IMEKeyFix.applied() == 0"

  # chat (ISChat) only exists in multiplayer; it is an ISTextEntryBox like the box above

  "lua IMEKeyFix.setEnabled(false)"
  "wait 5"
  "check IMEKeyFix.applied() == 1"
  "lua IMEKeyFix.setEnabled(true)"
  "wait 5"
  "check IMEKeyFix.applied() == 0"
  "check IMEKeyFix.error() == nil"
  "lua IMEKeyFixTest.state('end')"
)
